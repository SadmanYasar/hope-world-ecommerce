apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-devopslab-deployment
spec:
  selector:
    matchLabels:
      app: serving-web-content-complete
  replicas: 2
  template:
    metadata:
      labels:
        app: serving-web-content-complete
    spec:
      containers:
      - name: serving-web-content-complete
        image: sadmanyasar17/devopsimage1:latest  # Fixed to match pushed image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
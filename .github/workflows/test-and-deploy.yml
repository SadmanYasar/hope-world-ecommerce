name: Test and Deploy

on:
  push:
    branches: [main, sc_branch]
  pull_request:
    branches: [main, sc_branch]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      NEXT_PUBLIC_SUPABASE_BUCKET_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_BUCKET_URL }}
    strategy:
      fail-fast: false
      matrix:
        project: [storefront, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create Supabase environment files
        run: |
          # Create .env.local for both projects
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > apps/frontend_storefront/.env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> apps/frontend_storefront/.env.local
          echo "SERVICE_KEY=${{ secrets.SERVICE_KEY }}" >> apps/frontend_storefront/.env.local
          echo "NEXT_PUBLIC_SUPABASE_BUCKET_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_BUCKET_URL }}" >> apps/frontend_storefront/.env.local

          # Copy the same env file to admin app
          cp apps/frontend_storefront/.env.local apps/frontend_admin/.env.local

          # Verify the files were created
          echo "Created environment files:"
          ls -la apps/frontend_storefront/.env.local
          ls -la apps/frontend_admin/.env.local

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests for ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}

  deploy-frontend:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    strategy:
      matrix:
        include:
          - app: frontend_storefront
            project_id: VERCEL_PROJECT_ID_STOREFRONT
          - app: frontend_admin
            project_id: VERCEL_PROJECT_ID_ADMIN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # To check which files changed

      - name: Check if app changed
        id: check_changes
        run: |
          git diff HEAD^ HEAD --quiet apps/${{ matrix.app }} || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Install Vercel CLI
        if: steps.check_changes.outputs.changed == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_changes.outputs.changed == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}

      - name: Build Project Artifacts
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cd apps/${{ matrix.app }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}

      - name: Deploy to Vercel
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cd apps/${{ matrix.app }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id] }}

  deploy-docker:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend_storefront, frontend_admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DO_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if app changed
        id: check_changes
        run: |
          git diff HEAD^ HEAD --quiet apps/${{ matrix.app }} || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.check_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/hope-world-ecommerce-${{ matrix.app }}:latest
            ghcr.io/${{ env.OWNER_LC }}/hope-world-ecommerce-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
